[project]
name = "apu-streaming"
version = "0.1.0"
description = "Proyecto integrador: pipeline de streaming Kafka + Apache Beam/Flink para mantenimiento predictivo de APU (MetroPT-3)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "altair>=5.5,<6",
  "apache-beam==2.74.0",
  "betterproto==2.0.0b6",
  "confluent-kafka>=2.8,<3",
  "marimo>=0.19,<1",
  "pandas>=2.2,<3",
  "pip>=25,<27",
  "pyarrow>=18,<21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apu_streaming"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires the Docker Compose stack"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"*_notebook.py" = ["B018"]
"src/apu_streaming/transforms.py" = ["B008"]
